# 테마 관심도 설정
#
# anchor: 모든 API 호출에 함께 넣는 기준 키워드.
#   데이터랩은 "한 번의 호출 안에서" 최댓값을 100으로 잡기 때문에,
#   호출을 여러 번 나누면 서로 스케일이 달라집니다.
#   같은 앵커를 매 호출에 끼워 넣고 그 비율로 되돌리면 전부 같은 자로 잽니다.
#   앵커는 검색량이 극단적으로 크거나 작지 않은 것을 고르세요.
anchor:
  groupName: 앵커
  keywords: [코스피]

# 조회 기간 (일 단위 lookback). 1년치를 일간으로 한 번 받아,
# 아래 windows 로 잘라 1개월/3개월/6개월/1년 뷰를 만듭니다.
lookback_days: 365    # 1년
time_unit: date       # date | week | month

# 화면 상단 기간 버튼. days 만큼 최근 구간을 잘라 순위·변화율·차트를 계산합니다.
windows:
  - {key: "1m", days: 30,  label: "1개월"}
  - {key: "3m", days: 90,  label: "3개월"}
  - {key: "6m", days: 180, label: "6개월"}
  - {key: "1y", days: 365, label: "1년"}
default_window: "3m"

# 일간 데이터는 니치 테마에서 튀므로 표시·계산 모두 이 일수의 이동평균을 씁니다.
smooth_days: 7

# groups 는 폴백용 정적 목록입니다. 평소에는 sync_notion.py 가 Notion
# 'Datalab-Monitor' DB 에서 받아 config/themes.groups.json 을 만들고 그걸 우선 씁니다.
# (Notion 토큰이 없거나 동기화 실패 시에만 아래 목록으로 되돌아갑니다.)
# Notion DB 와 동일하게 유지 — 그룹당 키워드 최대 20개.
groups:
  - {groupName: HBM, sector: 반도체, keywords: [HBM, 고대역폭메모리, HBM4]}
  - {groupName: 유리기판·ABF, sector: 반도체, keywords: [유리기판, 글라스기판, ABF기판, TGV]}
  - {groupName: 실리콘포토닉스·CPO, sector: 반도체, keywords: [실리콘포토닉스, CPO, 광트랜시버]}
  - {groupName: 파운드리, sector: 반도체, keywords: [파운드리, 2나노, TSMC]}
  - {groupName: AI 데이터센터, sector: AI·데이터센터, keywords: [AI데이터센터, 데이터센터, 액침냉각]}
  - {groupName: 전력기기·전선, sector: 에너지·전력, keywords: [변압기, 전력기기, 초고압케이블]}
  - {groupName: 원전·SMR, sector: 에너지·전력, keywords: [SMR, 소형모듈원자로, 원전주]}
  - {groupName: 수소·연료전지, sector: 에너지·전력, keywords: [수소, 연료전지, 수소차]}
  - {groupName: 2차전지·ESS, sector: 에너지·전력, keywords: [2차전지, 전고체배터리, ESS]}
  - {groupName: 전기차, sector: 모빌리티, keywords: [전기차, 캐즘, 전기차수요]}
  - {groupName: 자율주행·FSD, sector: 모빌리티, keywords: [자율주행, FSD, 로보택시, 라이다]}
  - {groupName: 로봇·피지컬AI, sector: 모빌리티, keywords: [휴머노이드, 휴머노이드로봇, 피지컬AI]}
  - {groupName: 지상·전차, sector: 방산, keywords: [전차, K2전차, 장갑차]}
