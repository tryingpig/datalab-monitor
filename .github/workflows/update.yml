name: 데이터 갱신

on:
  schedule:
    # GitHub Actions 는 UTC 기준입니다. 09:30 UTC = 18:30 KST, 평일만.
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datalab-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테마 목록 동기화 (Notion → config)
        env:
          # rs-tracker 와 동일한 Notion 통합 토큰. 없으면 themes.yaml 정적 목록으로 폴백.
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python -m collector.sync_notion

      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 발급처: legacy(기본) | apihub. 리포지토리 Variables 에 NAVER_API_STYLE 를
          # 넣으면 그 값을, 없으면 legacy 를 씁니다.
          NAVER_API_STYLE: ${{ vars.NAVER_API_STYLE || 'legacy' }}
        run: python -m collector

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
